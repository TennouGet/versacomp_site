badge: "Research Project"
title: "VERSACOMP"
tagline: "VERSAtile COMPuting with Advanced Processor Architectures"
meta: "Heterogeneous Systems Research"
date: "2025 – 2028"

overview: >
  The advent of processors with Artificial Intelligence (AI) capabilities represents a significant leap forward. 
  This project aims at redefining the boundaries of what is possible with general-purpose computing. 
  Unlocking the full capabilities of modern heterogeneous systems with AI-enhanced processors for a broader range 
  of computational tasks can result in substantial improvements in performance, energy efficiency, and cost-effectiveness.

objectives:
  - title: "01. General AI Offload"
    description: "Adapting non-machine-learning workloads to execute directly on specialized matrix and vector engines."
  
  - title: "02. Energy Optimization"
    description: "Substantially lowering energy per instruction by using low-power hardware blocks for standard computing logic."

  - title: "03. System Integration"
    description: "Designing modern software dispatch pipelines so developers can harness hardware without low-level manual assembly."

phases:
  - name: "Phase 1: Architecture Profiling"
    summary: "Initial architectural profiling of existing AI coprocessors and identification of possible bottlenecks."
    status: "In Progress"

  - name: "Phase 2: Hardware Abstraction Layer"
    summary: "Developing dedicated abstraction layers for distinct target hardware, standardizing access across disparate CPUs, NPUs, and accelerators."
    status: "In Progress"

  - name: "Phase 3: Integrated Application & Workload Routing"
    summary: "Implementing a unified application framework that dynamically analyzes tasks and routes workloads to the optimal compute engine based on efficiency and throughput."
    status: "In Progress"

